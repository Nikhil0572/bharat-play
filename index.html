<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Play</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bharat Play">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login / signup screen shown on first visit -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-logo-mark"></div>
  <div class="auth-title">Bharat<span>Play</span></div>
  <div class="auth-subtitle">Watch, create and share reels</div>

  <button class="google-btn" id="googleSignInBtn">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.6 6.5 29.1 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c10.1 0 19.5-7.3 19.5-19.5 0-1.3-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c2.8 0 5.3 1 7.3 2.7l6-6C33.6 6.5 29.1 4.5 24 4.5c-7.6 0-14.1 4.3-17.4 10.6z"/>
      <path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-1.7 13.5-4.7l-6.2-5.3c-2 1.4-4.5 2.2-7.3 2.2-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.8 39.1 16.4 43.5 24 43.5z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.2 5.3C40.9 36.2 43.5 30.6 43.5 24c0-1.3-.1-2.3-.4-3.5z"/>
    </svg>
    <span>Continue with Google</span>
  </button>
  <div class="auth-error" id="googleError" style="display:none;">Could not sign in. Please try again.</div>

  <div class="auth-note" id="authDemoNote">
    We use Google Sign-In to create and verify your account securely.
  </div>
  <div class="auth-credit">Bharat Play — founded &amp; owned by Nitin Sharma ✔</div>
</div>

<div id="app">

  <div class="topbar">
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">Bharat<span>Play</span></div>
    </div>
    <div class="tab-row">
      <div class="tab" id="tabFollowing">Following</div>
      <div class="tab active" id="tabReels">Reels</div>
    </div>
  </div>

  <button class="mute-btn" id="muteBtn" aria-label="Mute toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <div class="feed" id="feed"></div>

  <div class="bottomnav">
    <div class="nav-item active" id="navHome">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item" id="navSearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </div>
    <div class="nav-item" id="navCreate">
      <div class="nav-create">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>Create</span>
    </div>
    <div class="nav-item" id="navLikes">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <span>Liked</span>
    </div>
    <div class="nav-item" id="navProfile">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </div>
  </div>
</div>

<!-- Bottom sheet used for comments / share / more / placeholders -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content" id="sheetContent"></div>
  </div>
</div>

<!-- Simple full screen placeholders for nav tabs -->
<div class="screen-overlay" id="screenOverlay">
  <div class="screen-header">
    <button class="screen-back" id="screenBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="screen-title" id="screenTitle">Title</div>
  </div>
  <div class="screen-body" id="screenBody"></div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
